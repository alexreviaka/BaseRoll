name: Verify Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network'
        required: true
        default: 'baseSepolia'
        type: choice
        options:
          - baseSepolia
          - baseMainnet

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Compile contracts
        run: npx hardhat compile
      
      - name: Verify contracts
        run: |
          sleep 5
          HARDHAT_NETWORK=${{ github.event.inputs.network }} node scripts/verify-manual.js
        env:
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
