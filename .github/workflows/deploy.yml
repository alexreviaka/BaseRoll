name: Deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network'
        required: true
        default: 'baseSepolia'
        type: choice
        options:
          - baseSepolia
          - baseMainnet

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Deploy contracts
        run: |
          npm install
          npx hardhat compile
          npx hardhat run scripts/deploy.js --network ${{ github.event.inputs.network }}
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
      
      - name: Verify contracts
        run: |
          sleep 10
          npx hardhat run scripts/verify.js --network ${{ github.event.inputs.network }}
        env:
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
      
      - name: Commit deployment addresses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments.json
          git diff --staged --quiet || git commit -m "chore: update deployment addresses for ${{ github.event.inputs.network }}"
          git push
