name: Deploy

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target Network'
        required: true
        type: choice
        options:
          - base_sepolia
          - base_mainnet
      dry_run:
        description: 'Dry run (simulate deployment)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Run tests
        run: forge test --match-contract BaseRollV1Test

      - name: Build contracts
        run: forge build --sizes

      - name: Set RPC URL
        id: set_rpc
        run: |
          if [ "${{ github.event.inputs.network }}" = "base_sepolia" ]; then
            echo "rpc_url=${{ secrets.BASE_SEPOLIA_RPC }}" >> $GITHUB_OUTPUT
            echo "etherscan_url=https://api-sepolia.basescan.org/api" >> $GITHUB_OUTPUT
          else
            echo "rpc_url=${{ secrets.BASE_MAINNET_RPC }}" >> $GITHUB_OUTPUT
            echo "etherscan_url=https://api.basescan.org/api" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to ${{ github.event.inputs.network }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "🔍 Dry run mode - simulating deployment"
            forge script script/DeployBaseRoll.s.sol:DeployBaseRoll \
              --rpc-url "${{ steps.set_rpc.outputs.rpc_url }}"
          else
            echo "🚀 Deploying to ${{ github.event.inputs.network }}"
            forge script script/DeployBaseRoll.s.sol:DeployBaseRoll \
              --rpc-url "${{ steps.set_rpc.outputs.rpc_url }}" \
              --broadcast \
              --verify \
              --etherscan-api-key "${{ secrets.BASESCAN_API_KEY }}" \
              --verifier-url "${{ steps.set_rpc.outputs.etherscan_url }}"
          fi
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOYER_ADDRESS: ${{ secrets.DEPLOYER_ADDRESS }}

      - name: Save deployment artifacts
        if: github.event.inputs.dry_run == 'false'
        run: |
          CHAIN_ID=${{ github.event.inputs.network == 'base_sepolia' && '84532' || '8453' }}
          mkdir -p deployments
          if [ -f "broadcast/DeployBaseRoll.s.sol/$CHAIN_ID/run-latest.json" ]; then
            cp broadcast/DeployBaseRoll.s.sol/$CHAIN_ID/run-latest.json deployments/${{ github.event.inputs.network }}.json
            echo "✅ Deployment artifacts saved"
          else
            echo "⚠️ No deployment artifacts found"
          fi

      - name: Commit deployment data
        if: github.event.inputs.dry_run == 'false'
        run: |
          git config user.name "alexreviaka"
          git config user.email "reviakaaliakseii@gmail.com"
          git add deployments/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(deploy): ${{ github.event.inputs.network }} deployment $(date +%Y-%m-%d)"
            git push origin development
            echo "✅ Deployment data committed"
          fi
