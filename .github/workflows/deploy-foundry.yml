name: Deploy BaseRoll V1

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target Network'
        required: true
        default: 'base_sepolia'
        type: choice
        options:
          - base_sepolia
          - base_mainnet

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Deploy to ${{ github.event.inputs.network }}
        run: |
          forge script script/DeployBaseRoll.s.sol:DeployBaseRoll \
            --rpc-url ${{ github.event.inputs.network }} \
            --broadcast \
            --verify
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          DEPLOYER_ADDRESS: ${{ secrets.DEPLOYER_ADDRESS }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC }}
          BASE_MAINNET_RPC: ${{ secrets.BASE_MAINNET_RPC }}

      - name: Save deployment artifacts
        run: |
          mkdir -p deployments
          cp broadcast/DeployBaseRoll.s.sol/${{ github.event.inputs.network == 'base_sepolia' && '84532' || '8453' }}/run-latest.json deployments/${{ github.event.inputs.network }}.json

      - name: Commit deployment data
        run: |
          git config user.name "alexreviaka"
          git config user.email "reviakaaliakseii@gmail.com"
          git add deployments/
          git diff --staged --quiet || git commit -m "chore(deploy): update ${{ github.event.inputs.network }} deployment addresses"
          git push origin development
