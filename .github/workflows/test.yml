name: Tests

on:
  workflow_dispatch:
    inputs:
      verbosity:
        description: 'Test verbosity level'
        required: false
        type: choice
        default: 'normal'
        options:
          - normal
          - verbose
          - very_verbose

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        run: |
          case "${{ github.event.inputs.verbosity }}" in
            verbose)
              forge test -vv
              ;;
            very_verbose)
              forge test -vvvv
              ;;
            *)
              forge test -v
              ;;
          esac

      - name: Generate gas report
        run: forge test --gas-report

      - name: Run coverage
        run: forge coverage --report summary
